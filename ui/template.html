<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenWrt operation</title>
<style>
:root{color-scheme:light dark;--fallback-bg:#fff;--fallback-fg:#0d0d0d;--fallback-muted:#6b6b6b;--fallback-line:#e5e5e5;--fallback-soft:#f7f7f8;--fallback-danger:#b42318;--fallback-warn:#926000;--fallback-success:#16804a;
--bg:var(--color-background-primary,var(--fallback-bg));--fg:var(--color-text-primary,var(--fallback-fg));--muted:var(--color-text-secondary,var(--fallback-muted));--line:var(--color-border-secondary,var(--fallback-line));--soft:var(--color-background-secondary,var(--fallback-soft));--accent:var(--fg);--danger:var(--color-text-danger,var(--fallback-danger));--warn:var(--color-text-warning,var(--fallback-warn));--success:var(--color-text-success,var(--fallback-success));font:var(--font-text-sm-size,14px)/var(--font-text-sm-line-height,1.5) var(--font-sans,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fallback-bg:#212121;--fallback-fg:#ececec;--fallback-muted:#a0a0a0;--fallback-line:#424242;--fallback-soft:#2f2f2f;--fallback-danger:#ff8b85;--fallback-warn:#e9be74;--fallback-success:#75d49a}}
:root[data-theme=dark]{color-scheme:dark;--fallback-bg:#212121;--fallback-fg:#ececec;--fallback-muted:#a0a0a0;--fallback-line:#424242;--fallback-soft:#2f2f2f;--fallback-danger:#ff8b85;--fallback-warn:#e9be74;--fallback-success:#75d49a}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:850px;padding:20px;margin:auto}header{display:flex;gap:12px;align-items:flex-start}.mark{width:42px;height:42px;flex-shrink:0;border-radius:var(--border-radius-md,12px);background:var(--soft);color:var(--accent);padding:9px}.mark svg{width:24px;height:24px;display:block}.heading{min-width:0;flex:1}h1{font-size:var(--font-heading-sm-size,16px);line-height:var(--font-heading-sm-line-height,1.4);margin:0 0 4px}p{margin:4px 0;color:var(--muted);overflow-wrap:anywhere}.scope{font:12px/1.5 var(--font-mono,ui-monospace,monospace)}.badge{border:1px solid var(--line);border-radius:30px;padding:3px 9px;font-size:11px;white-space:nowrap;color:var(--accent)}.badge.ok{color:var(--success)}.badge.error,.badge.denied{color:var(--danger)}.badge.pending{color:var(--warn)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:16px 0}.fact{background:var(--soft);border-radius:var(--border-radius-lg,12px);padding:10px 12px}.fact span{display:block;color:var(--muted);font-size:11px}.fact strong{font-size:15px;font-weight:600;overflow-wrap:anywhere}h2{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 7px}.table-wrap,.logs{border:1px solid var(--line);border-radius:var(--border-radius-lg,12px);max-height:240px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 10px;overflow-wrap:anywhere;word-break:break-word}th{color:var(--muted);font-weight:500;background:var(--soft);position:sticky;top:0}tr:last-child td{border:0}td:first-child{font-weight:550;max-width:220px}.log{font:12px/1.6 var(--font-mono,ui-monospace,monospace);padding:7px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.log:last-child{border:0}.log.error{color:var(--danger)}.log.warn{color:var(--warn)}.banner{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--border-radius-lg,12px);padding:12px;margin:16px 0;background:var(--soft)}.banner.error,.banner.denied{border-left-color:var(--danger)}.banner.pending{border-left-color:var(--warn)}.banner strong{display:block}.banner p{font-size:12px}.countdown{color:var(--warn);font:600 14px/1.6 var(--font-mono,ui-monospace,monospace)}details{margin-top:14px}summary{user-select:none;touch-action:manipulation;font-size:13px;color:var(--muted);cursor:pointer;padding:12px 0;min-height:44px}pre{background:var(--soft);border-radius:var(--border-radius-md,10px);padding:12px;max-height:230px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 var(--font-mono,ui-monospace,monospace)}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}button{user-select:none;touch-action:manipulation;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:var(--border-radius-full,24px);padding:9px 16px;min-height:44px;cursor:pointer}button:hover{background:var(--line)}button:disabled{opacity:.6;cursor:wait}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}small{font-size:11px;color:var(--muted);margin-left:auto}.note,#error{font-size:12px;margin-top:10px}#error{color:var(--danger)}@media(max-width:420px){main{padding:14px}header{display:grid;grid-template-columns:42px minmax(0,1fr)}.badge{grid-column:2;justify-self:start}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}small{margin:0;width:100%}td,th{padding:7px}.mark{grid-row:1/3}}
</style><main id="card" aria-live="polite"><p>Loading router operation…</p></main><script>/* BUNDLE */</script></html>
