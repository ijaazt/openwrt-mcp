<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenWrt operation</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#132a32;--muted:#687b81;--line:#dce7e9;--soft:#f3f8f8;--accent:#087d71;--danger:#b42b35;--warn:#966000;font:14px/1.5 system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#171f23;--fg:#eaf5f5;--muted:#a4b8bd;--line:#34464d;--soft:#202d33;--accent:#62dac9;--danger:#ff9098;--warn:#e9bf72}}
:root[data-theme=dark]{--bg:#171f23;--fg:#eaf5f5;--muted:#a4b8bd;--line:#34464d;--soft:#202d33;--accent:#62dac9;--danger:#ff9098;--warn:#e9bf72}
:root[data-theme=light]{--bg:#fff;--fg:#132a32;--muted:#687b81;--line:#dce7e9;--soft:#f3f8f8;--accent:#087d71;--danger:#b42b35;--warn:#966000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:850px;padding:20px;margin:auto}header{display:flex;gap:12px;align-items:flex-start}.mark{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:var(--soft);color:var(--accent);padding:7px}.heading{min-width:0;flex:1}h1{font-size:18px;line-height:1.3;margin:0 0 4px}p{margin:4px 0;color:var(--muted);overflow-wrap:anywhere}.scope{font:12px/1.5 ui-monospace,monospace}.badge{border:1px solid var(--line);border-radius:30px;padding:3px 9px;font-size:11px;white-space:nowrap;color:var(--accent)}.badge.error,.badge.denied{color:var(--danger)}.badge.pending{color:var(--warn)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin:16px 0}.fact{background:var(--soft);border-radius:10px;padding:10px 12px}.fact span{display:block;color:var(--muted);font-size:11px}.fact strong{font-size:15px;font-weight:600;overflow-wrap:anywhere}h2{font-size:12px;color:var(--muted);font-weight:600;margin:16px 0 7px}.table-wrap,.logs{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 10px;overflow-wrap:anywhere;word-break:break-word}th{color:var(--muted);font-weight:500;background:var(--soft);position:sticky;top:0}tr:last-child td{border:0}td:first-child{font-weight:550;max-width:220px}.log{font:12px/1.6 ui-monospace,monospace;padding:7px 10px;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.log:last-child{border:0}.log.error{color:var(--danger)}.log.warn{color:var(--warn)}.banner{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px;margin:16px 0;background:var(--soft)}.banner.error,.banner.denied{border-left-color:var(--danger)}.banner.pending{border-left-color:var(--warn)}.banner strong{display:block}.banner p{font-size:12px}.countdown{color:var(--warn);font:600 14px/1.6 ui-monospace,monospace}details{margin-top:14px}summary{font-size:12px;color:var(--muted);cursor:pointer}pre{background:var(--soft);border-radius:9px;padding:12px;max-height:230px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace}footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}small{font-size:11px;color:var(--muted);margin-left:auto}.note,#error{font-size:12px;margin-top:10px}#error{color:var(--danger)}@media(max-width:420px){main{padding:14px}header{display:grid;grid-template-columns:42px minmax(0,1fr)}.badge{grid-column:2;justify-self:start}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}small{margin:0;width:100%}td,th{padding:7px}.mark{grid-row:1/3}}
</style><main id="card" aria-live="polite"><p>Loading router operation…</p></main><script>/* BUNDLE */</script></html>
